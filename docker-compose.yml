version: "3.8"

services:
  triage-workbench:
    image: ghcr.io/niightgamez/scam-triage-workbench:latest
    restart: unless-stopped

    # Strictly bind to 127.0.0.1 (never expose directly on 0.0.0.0)
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"

    # Defense-in-depth container hardening
    read_only: true
    tmpfs:
      - "/tmp:size=32M,noexec,nosuid,nodev"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    # Strict resource constraints
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 64

    # Configurable environment with safe defaults (does not require a local .env file)
    environment:
      - DEMO_MODE_ONLY=${DEMO_MODE_ONLY:-true}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-10}
      - ROOT_PATH=${ROOT_PATH:-}
